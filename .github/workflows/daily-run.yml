name: Daily UGC OS Run

on:
  schedule:
    # 11:00 UTC = 7:00 AM ET (EDT, UTC-4). Change to '0 12 * * *' Nov–Mar (EST).
    - cron: '0 11 * * *'
  workflow_dispatch: # allow manual trigger from GitHub Actions UI

permissions:
  contents: write

jobs:
  daily-run:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Run daily UGC session
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          TODAY=$(date +%Y-%m-%d)
          PROMPT=$(sed "s/{{TODAY}}/$TODAY/g" routines/daily-prompt.md)
          claude --dangerouslySkipPermissions -p "$PROMPT" \
            --allowedTools "Read,Write,Edit,Bash,WebFetch,WebSearch"

      - name: Commit all updates
        run: |
          git config user.email "ugc-os-bot@worldwidewmal.com"
          git config user.name "UGC OS Bot"
          git add pipeline.csv data/ reports/ || true
          git diff --staged --quiet && echo "No changes to commit." || \
            git commit -m "Daily run $(date +%Y-%m-%d) — automated pipeline update"

      - name: Push changes
        run: git push origin HEAD
