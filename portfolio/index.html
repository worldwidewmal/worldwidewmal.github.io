<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<script>if(window.top!==window.self){try{window.top.location=window.self.location;}catch(e){document.body.innerHTML='';}}</script>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; frame-src https://www.canva.com https://canva.link https://*.canva.com https://*.canva.site; connect-src 'self'; form-action 'self'; base-uri 'self'; object-src 'none'; worker-src 'none'; manifest-src 'self'; upgrade-insecure-requests;"/>
<meta http-equiv="Permissions-Policy" content="accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), usb=(), serial=(), bluetooth=(), browsing-topics=()"/>
<meta name="referrer" content="strict-origin-when-cross-origin"/>
<title>Portfolio | Worldwidewmal</title>
<meta name="description" content="Selected UGC and travel content work by Worldwidewmal: brand collaborations, short-form video, and creator campaigns for hotels, tourism, restaurants, and experiences."/>
<link rel="canonical" href="https://worldwidewmal.com/portfolio"/>
<meta property="og:type" content="website"/>
<meta property="og:title" content="Portfolio | Worldwidewmal"/>
<meta property="og:description" content="Selected UGC and travel content work by Worldwidewmal: brand collaborations, short-form video, and creator campaigns."/>
<meta property="og:url" content="https://worldwidewmal.com/portfolio"/>
<meta property="og:image" content="https://worldwidewmal.com/logo.png"/>
<meta name="twitter:card" content="summary_large_image"/>
<meta name="twitter:title" content="Portfolio | Worldwidewmal"/>
<meta name="twitter:description" content="Selected UGC and travel content work by Worldwidewmal: brand collaborations, short-form video, and creator campaigns."/>
<meta name="twitter:image" content="https://worldwidewmal.com/logo.png"/>
<link rel="icon" href="../logo.png"/>
<!-- DNS + TCP to Canva resolved before iframe starts loading -->
<link rel="preconnect" href="https://www.canva.com" crossorigin/>
<link rel="dns-prefetch" href="https://www.canva.com"/>
<link rel="dns-prefetch" href="https://static.canva.com"/>
<link rel="dns-prefetch" href="https://media.canva.com"/>
<style>
@font-face{font-family:'DM Sans';font-style:normal;font-weight:300 600;font-display:swap;src:url(../assets/fonts/dm-sans-normal-ca72d2bc.woff2) format('woff2')}
@font-face{font-family:'Cormorant Garamond';font-style:normal;font-weight:200 600;font-display:swap;src:url(../assets/fonts/cormorant-garamond-normal-d80df8ff.woff2) format('woff2')}
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:#09080a;color:#eae5dc;
  font-family:'DM Sans',system-ui,-apple-system,sans-serif;
  height:100vh;height:100svh;
  display:flex;flex-direction:column;overflow:hidden;
}
/* ---- sticky top bar ---- */
.pf-bar{
  position:relative;z-index:10;flex:0 0 auto;
  display:flex;align-items:center;justify-content:space-between;gap:14px;
  padding:12px 18px;background:rgba(9,8,10,.96);backdrop-filter:blur(8px);
  border-bottom:1px solid rgba(201,160,86,.18);
}
.pf-brand{font-family:'Cormorant Garamond',Georgia,serif;font-size:1.05rem;letter-spacing:.06em;color:#c9a056}
.pf-back{
  display:inline-flex;align-items:center;gap:8px;
  padding:11px 22px;border-radius:100px;
  background:#c9a056;color:#09080a;text-decoration:none;
  font-size:.74rem;font-weight:600;letter-spacing:.07em;text-transform:uppercase;
  transition:opacity .2s,transform .2s;white-space:nowrap;
}
.pf-back:hover{opacity:.9;transform:translateX(-2px)}
/* ---- embed ---- */
/* One fixed viewport-height frame on EVERY device (this is what the desktop
   view already did and it works). Canva's embed scrolls its own content
   inside the frame, so there is a single scroll context — no tall iframe
   sitting inside a scrolling page, which is what trapped touch scrolling on
   mobile and clipped everything below "hotel/properties". And because the
   height is the viewport (not a hard-coded design ratio), it can never clip
   the bottom of the design no matter how tall the design is or how often
   it's edited in Canva.                                                     */
.pf-embed-outer{position:relative;flex:1 1 auto;min-height:0;max-width:100%;margin:0;padding:0}
.pf-embed{position:relative;width:100%;height:100%;overflow:hidden;background:#0b0a0d}
.pf-embed iframe{position:absolute;inset:0;width:100%;height:100%;border:0;margin:0;padding:0}
/* ---- loader — visible immediately, fades out when Canva fires load ----
   Positioned absolute *inside* pf-embed-outer (not fixed with a hardcoded
   top offset) so it always covers exactly the embed area regardless of how
   tall the bar + fallback row above it are.                                */
.pf-loader{
  position:absolute;inset:0;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;
  background:#0b0a0d;opacity:1;visibility:visible;transition:opacity .4s;z-index:5;
}
.pf-loader.hide{opacity:0;visibility:hidden;pointer-events:none}
.pf-spin{width:38px;height:38px;border-radius:50%;border:3px solid rgba(201,160,86,.2);border-top-color:#c9a056;animation:pfspin .8s linear infinite}
.pf-loadtxt{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:rgba(234,229,220,.5)}
@keyframes pfspin{to{transform:rotate(360deg)}}
@media(max-width:560px){
  .pf-brand{display:none}
  .pf-bar{justify-content:center}
  .pf-back{width:100%;justify-content:center}
}
/* Escape hatch, mobile only, own row so it can't collide with the bar's
   existing flex/width rules at any breakpoint. A blocked/failed iframe still
   fires its 'load' event (no reliable way to detect that in JS), so this
   stays permanently available rather than conditionally revealed on failure. */
.pf-fallback-row{display:none;text-align:center;padding:6px 12px;background:#08070a;border-bottom:1px solid rgba(201,160,86,.1)}
.pf-fallback-row a{font-size:.66rem;color:rgba(201,160,86,.6);text-decoration:underline}
@media(max-width:767px){.pf-fallback-row{display:block}}
</style>
</head>
<body>

<header class="pf-bar">
  <span class="pf-brand">worldwidewmal</span>
  <a class="pf-back" href="/#ugc-pricing">&larr; View UGC Packages &amp; Pricing</a>
</header>

<div class="pf-fallback-row">
  <a href="https://worldwidewmal.my.canva.site" target="_top">Trouble viewing? Open the portfolio directly</a>
</div>

<div class="pf-embed-outer">
  <div class="pf-loader" id="pf-loader">
    <div class="pf-spin"></div>
    <div class="pf-loadtxt">Loading portfolio</div>
  </div>
  <div class="pf-embed">
    <!--
      Desktop/tablet: the Canva DESIGN embed (fixed layout, viewport-fill frame).
      Phones: the published Canva SITE, which is Canva's own responsive mobile
      build (fit-to-screen text and images) — served inline here so the address
      bar still reads worldwidewmal.com/portfolio instead of the canva.site URL.
      EDIT the desktop URL below to update the design embed.
    -->
    <iframe id="pf-frame" title="Worldwidewmal portfolio" loading="eager" fetchpriority="high"
      allow="fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>
  </div>
</div>

<script>
(function(){
  var DESKTOP_EMBED_URL = 'https://www.canva.com/design/DAHN4eP3wPA/XJKyM5JlWnJ9XhMsBnIVPg/view?embed';
  var MOBILE_SITE_URL   = 'https://worldwidewmal.my.canva.site';
  var isMobile = window.matchMedia && window.matchMedia('(max-width:767px)').matches;

  var loader = document.getElementById('pf-loader');
  var frame  = document.getElementById('pf-frame');

  frame.addEventListener('load', function(){
    loader.classList.add('hide');
  });

  frame.src = isMobile ? MOBILE_SITE_URL : DESKTOP_EMBED_URL;
})();
</script>

</body>
</html>
